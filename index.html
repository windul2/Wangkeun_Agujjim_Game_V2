r:#16333b;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}.overlay{position:absolute;inset:0;background:#0b2835b8;backdrop-filter:blur(5px);display:grid;place-items:center;padding:15px}.overlay[hidden]{display:none}.card{max-width:460px;text-align:center;background:#f9f3df;color:#14343b;padding:24px 27px;border-radius:24px;box-shadow:0 16px 60px #00101870}.eyebrow{font-size:10px;font-weight:900;letter-spacing:3px;color:#b35a36}.card h1{font-size:clamp(24px,4vw,36px);line-height:1.15;margin:10px 0 12px;letter-spacing:-1.5px}.card p{font-size:13px;line-height:1.65;margin:9px 0;color:#4b6264}.legend{display:flex;justify-content:center;gap:13px;margin:16px 0;font-size:12px;font-weight:750}.primary{background:#e56839;color:white;padding:12px 23px;border-radius:25px;font-weight:850;box-shadow:0 4px 0 #b94c28}.card small{display:block;font-size:10px;color:#697c79;margin-top:16px}.bottom{flex-shrink:0;display:flex;flex-direction:column;gap:7px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.controls button{border-radius:12px;padding:11px 5px;font-size:12px;font-weight:850;background:#28464a;color:#f9f3df;border:1px solid #56706c}.controls .start{background:#e56839;border-color:#f38a52}.controls button.active{background:#f3ca78;color:#18363b;border-color:#f3ca78}.controls button:disabled{opacity:.4;cursor:default}.mobile{display:none}.hint{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#b2c8c0;gap:8px}.sound{background:transparent;color:#c8d9cb;font-size:11px;padding:2px}.dash{border:1px solid #e7ad68;background:#edab5c;color:#12343b;border-radius:50%;width:65px;height:65px;font-weight:900;font-size:11px;touch-action:none}.stick{position:relative;width:84px;height:84px;border-radius:50%;border:1px solid #ffffff3d;background:#fff1;touch-action:none}.knob{position:absolute;left:26px;top:26px;width:30px;height:30px;background:#e8e6cf;border:4px solid #bed5c7;border-radius:50%;pointer-events:none;box-shadow:0 3px 9px #0004}.touchui{position:absolute;inset:auto 15px 15px;display:none;justify-content:space-between;align-items:end;pointer-events:none}.touchui>*{pointer-events:auto}.auto-label{position:absolute;bottom:15px;right:15px;background:#f3ca78;color:#17373a;border-radius:14px;padding:6px 10px;font-size:10px;font-weight:900;pointer-events:none;display:none}.auto-label.on{display:block}
@media(pointer:coarse){.touchui{display:flex}.hint .keys{display:none}.hint:before{content:'왼쪽 조이스틱 이동 · 오른쪽 버튼 돌진'}.toast{bottom:112px}.auto-label{bottom:89px}}
@media(max-width:520px){.app{padding:10px 10px max(8px,env(safe-area-inset-bottom));gap:7px}.brand{font-size:9px;letter-spacing:1px}.shop{font-size:10px;padding:9px 11px}.stat{padding:8px 9px;border-radius:10px}.stat strong{font-size:16px}.stat small{font-size:9px}.card{padding:22px 18px}.arena{border-radius:17px}.chip{font-size:10px;padding:5px 7px}.controls button{padding:10px 3px;font-size:11px}}
@media(max-height:560px){.app{gap:5px;padding:6px 10px}.brand{display:none}.title{font-size:18px}.stats{gap:5px}.stat{padding:4px 10px;flex-direction:row;align-items:center;justify-content:space-between}.stat strong{font-size:15px}.controls button{padding:7px}.hint{display:none}.card{padding:13px 25px}.card h1{font-size:24px;margin:5px}.card p{font-size:11px;margin:5px}.legend{margin:8px}.card small{margin-top:8px}.touchui{bottom:9px}.stick{width:66px;height:66px}.knob{left:18px;top:18px}.dash{width:54px;height:54px}.toast{bottom:85px}}

<body>
<main class="app">
<header><div><div class="brand">왕큰아구찜 & 대구뽈찜</div><div class="title">매콤한 바다 탐험 <span style="color:#f4bb6d">✦</span></div></div><a class="shop" href="https://windul2.github.io/Wangkeun_Agujjim_V2/" target="_blank" rel="noopener noreferrer">가게 구경 ↗</a></header>

</main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
let W=900;const H=620,types=['fish','sprout','pepper'],icons=['🐟','🌱','🌶'],names=['아구','콩나물','고추'];
let phase='ready',auto=false,soundOn=false,audioCtx,score=0,best=0,dishes=0,time=90,elapsed=0,inventory=[0,0,0],entities=[],particles=[],floats=[],keys={},joy={x:0,y:0},dashRequest=false,last=0,spawnTimer=0,toastTime=0,combo=0,lastDelivery=-100,seed=3941;
const p={x:W/2,y:H/2+100,r:17,hp:3,inv:0,cool:0,dash:0,dx:0,dy:-1};
try{best=Number(localStorage.getItem('wangkeun_spicy_sea_best'))||0}catch(e){}
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function tone(freq=500,len=.07){if(!soundOn)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+len);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+len)}catch(e){}}
function notify(t){$('toast').textContent=t;toastTime=2.4;$('toast').classList.add('show')}
function hud(){ $('score').textContent=score+' / '+best;$('time').textContent=Math.ceil(time)+'초';$('dish').textContent=dishes+' 접시';$('health').textContent='♥ '.repeat(p.hp)+'♡ '.repeat(3-p.hp);$('recipe').innerHTML=types.map((t,i)=>'<span class="chip '+(inventory[i]?'done':'')+'">'+icons[i]+' '+names[i]+' '+(inventory[i]?'✓':'0/1')+'</span>').join('');$('dash').innerHTML=p.cool>0?Math.ceil(p.cool)+'초':'돌진<br>✦';}
function updateButtons(){ $('pause').disabled=!['running','paused'].includes(phase);$('pause').textContent=phase==='paused'?'▶ 계속':'Ⅱ 정지';$('start').textContent=phase==='paused'?'▶ 계속':'▶ 시작';$('auto').classList.toggle('active',auto);$('auto').setAttribute('aria-pressed',String(auto));$('auto').textContent=auto?'✦ 자동 ON':'✦ 자동플레이';$('autolabel').classList.toggle('on',auto);}
function burst(x,y,color,n=13){for(let i=0;i<n;i++){let a=random()*Math.PI*2,s=50+random()*170;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55+random()*.35,color})}}
function freePosition(){for(let i=0;i<40;i++){let a={x:60+random()*(W-120),y:72+random()*(H-144)};if(Math.hypot(a.x-W/2,a.y-H/2)>78&&dist(a,p)>85&&entities.every(e=>dist(a,e)>35))return a}return{x:80,y:85}}
function ingredient(t){let a=freePosition();entities.push({...a,t,kind:'item',r:15,bob:random()*6})}
function replenish(){for(let t=0;t<3;t++){let count=entities.filter(e=>e.kind==='item'&&e.t===t).length;while(count++<3)ingredient(t)}}
function hazard(kind){let a=freePosition();entities.push({...a,kind,r:kind==='urchin'?19:20,angle:random()*6.28,fire:2+random()*2,dir:random()<.5?-1:1})}
function reset(){phase='ready';score=0;dishes=0;time=90;elapsed=0;inventory=[0,0,0];entities=[];particles=[];floats=[];keys={};joy={x:0,y:0};dashRequest=false;combo=0;lastDelivery=-100;seed=3941;p.x=W/2;p.y=H/2+110;p.hp=3;p.inv=0;p.cool=0;p.dash=0;spawnTimer=0;toastTime=0;$('toast').classList.remove('show');$('knob').style.transform='';replenish();for(let i=0;i<(W<550?3:5);i++)hazard('urchin');hazard('crab');showOverlay('바다에서 재료를,<br>냄비에서 한 접시!','아구·콩나물·고추를 하나씩 모아<br><b>중앙 냄비</b>로 배달하세요.<br>성게와 게를 피해 90초 동안 최고 점수에 도전!','탐험 시작 →');hud();updateButtons()}
function showOverlay(title,desc,button){$('headline').innerHTML=title;$('description').innerHTML=desc;$('overlayStart').textContent=button;$('overlay').hidden=false}
function start(){if(phase==='running')return;if(phase==='over')reset();phase='running';$('overlay').hidden=true;updateButtons();tone(430);notify(auto?'자동 항해 시작! 재료를 모아 배달합니다.':'재료 3종을 모은 뒤 중앙 냄비로!')}
function pause(){if(phase==='running'){phase='paused';keys={};joy={x:0,y:0};$('knob').style.transform='';showOverlay('잠깐 쉬어가요','모은 재료와 점수는 그대로입니다.<br>계속 버튼으로 탐험을 이어가세요.','계속하기 →')}else if(phase==='paused')start();updateButtons()}
function finish(){phase='over';if(score>best){best=score;try{localStorage.setItem('wangkeun_spicy_sea_best',String(best))}catch(e){}}hud();showOverlay(p.hp===0?'무사 귀환!<br>다시 도전해요.':'오늘의 배달 완료!','<b style="font-size:25px;color:#d46435">'+score+'점</b> · '+dishes+'접시 완성<br>최고 기록 '+best+'점<br>'+(dishes>=6?'바다의 배달 고수! 정말 매콤한 실력이네요.':'재료를 빠르게 배달하면 연속 보너스를 받아요.'),'다시 탐험 →');updateButtons();tone(260,.25)}
function targetCost(a){let cost=dist(a,p);for(let e of entities)if(e.kind!=='item'){let d=dist(a,e);if(d<95)cost+=(95-d)*4}return cost}
function bot(){let full=inventory.every(Boolean),targets=full?[{x:W/2,y:H/2}]:entities.filter(e=>e.kind==='item'&&!inventory[e.t]);let target=targets.sort((a,b)=>targetCost(a)-targetCost(b))[0]||{x:W/2,y:H/2};let bestCost=Infinity,choice={x:0,y:0};for(let i=0;i<24;i++){let a=i*Math.PI*2/24,v={x:Math.cos(a),y:Math.sin(a)},future={x:clamp(p.x+v.x*52,28,W-28),y:clamp(p.y+v.y*52,52,H-30)},cost=dist(future,target);for(let e of entities){if(e.kind==='item')continue;let d=dist(future,e)-e.r-p.r;cost+=d<0?450:(d<90?((90-d)/90)**2*210:0)}cost+=(future.x===28||future.x===W-28||future.y===52||future.y===H-30)?35:0;if(cost<bestCost){bestCost=cost;choice=v}}if(dist(p,target)<8)choice={x:0,y:0};let danger=entities.some(e=>e.kind!=='item'&&dist(e,p)<65);if(danger&&p.cool<=0)dashRequest=true;return choice}
function step(dt){if(phase!=='running')return;elapsed+=dt;time=Math.max(0,time-dt);p.inv=Math.max(0,p.inv-dt);p.cool=Math.max(0,p.cool-dt);p.dash=Math.max(0,p.dash-dt);toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('show');let v=auto?bot():{x:(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,y:(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y};let n=Math.hypot(v.x,v.y);if(n>.02){v.x/=Math.max(1,n);v.y/=Math.max(1,n);p.dx=v.x;p.dy=v.y}if(dashRequest){dashRequest=false;if(p.cool===0){p.dash=.21;p.cool=2.6;p.inv=Math.max(p.inv,.3);tone(750)}}let speed=p.dash>0?650:205;p.x=clamp(p.x+(p.dash>0?p.dx:v.x)*speed*dt,25,W-25);p.y=clamp(p.y+(p.dash>0?p.dy:v.y)*speed*dt,50,H-25);if(p.dash>0)particles.push({x:p.x,y:p.y,vx:0,vy:0,life:.15,color:'#fac378'});
let stage=1+Math.floor(elapsed/30);spawnTimer+=dt;if(spawnTimer>9){spawnTimer=0;if(entities.filter(e=>e.kind==='crab').length<(W<550?2:stage+1))hazard('crab');if(entities.filter(e=>e.kind==='urchin').length<(W<550?3+stage:5+stage))hazard('urchin')}
for(let e of [...entities]){if(e.kind==='item'){e.bob+=dt*2;if(dist(e,p)<p.r+e.r&&!inventory[e.t]){inventory[e.t]=1;entities.splice(entities.indexOf(e),1);score+=30;burst(e.x,e.y,['#88cfdd','#b9df87','#ff8865'][e.t],9);tone(480+e.t*120);if(inventory.every(Boolean))notify('재료 완료! 중앙 냄비에 배달하세요.');}}
else if(e.kind==='crab'){e.angle+=dt;e.fire-=dt;let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(Math.hypot(e.x-W/2,e.y-H/2)>88||Math.hypot(p.x-W/2,p.y-H/2)>130){e.x=clamp(e.x+dx/d*(24+stage*7)*dt,30,W-30);e.y=clamp(e.y+dy/d*(24+stage*7)*dt,55,H-30)}if(e.fire<=0){e.fire=3.8;entities.push({x:e.x,y:e.y,kind:'bubble',r:8,vx:dx/d*(85+stage*15),vy:dy/d*(85+stage*15),life:5})}}
else if(e.kind==='bubble'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;if(e.life<0||e.x<0||e.x>W||e.y<0||e.y>H){entities.splice(entities.indexOf(e),1);continue}}
if(e.kind!=='item'&&p.inv<=0&&dist(e,p)<e.r+p.r-4){p.hp--;p.inv=1.65;let a=Math.atan2(p.y-e.y,p.x-e.x);p.x=clamp(p.x+Math.cos(a)*35,25,W-25);p.y=clamp(p.y+Math.sin(a)*35,50,H-25);burst(p.x,p.y,'#ff967c');tone(150,.13);notify('앗! 돌진으로 위험한 순간을 피하세요.');if(p.hp<=0){finish();return}}
}
if(inventory.every(Boolean)&&Math.hypot(p.x-W/2,p.y-H/2)<61){combo=elapsed-lastDelivery<14?combo+1:1;lastDelivery=elapsed;let bonus=250+Math.min(combo-1,5)*50;score+=bonus;dishes++;inventory=[0,0,0];p.cool=0;burst(W/2,H/2,'#ffc867',25);floats.push({x:W/2,y:H/2-50,text:'+'+bonus+' · '+combo+'연속!',life:1.5});notify(dishes%3===0?'3접시 완성! 체력 1 회복 ♥':combo>1?combo+'연속 배달! +'+bonus+'점':'따끈한 한 접시 완성! +'+bonus+'점');if(dishes%3===0)p.hp=Math.min(3,p.hp+1);tone(880,.16);replenish()}
for(let e of particles){e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt}particles=particles.filter(e=>e.life>0);for(let f of floats){f.y-=dt*30;f.life-=dt}floats=floats.filter(f=>f.life>0);if(time<=0)finish();hud();}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function text(t,x,y,size,color,weight=800){ctx.fillStyle=color;ctx.font=weight+' '+size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function drawItem(e){let y=e.y+Math.sin(e.bob)*3;ellipse(e.x,y+19,15,4,'#082c3a66');ctx.save();ctx.translate(e.x,y);if(e.t===0){ellipse(0,0,21,14,'#91c8d3');ctx.fillStyle='#6aaebc';ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(-29,-11);ctx.lineTo(-29,11);ctx.fill();ellipse(8,-3,3,4,'#14323b');ellipse(9,-4,1,1,'#fff');ctx.strokeStyle='#d5e8df';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,-14);ctx.lineTo(11,-23);ctx.stroke();ellipse(12,-24,3,3,'#f9da83')}else if(e.t===1){ctx.strokeStyle='#efe8b8';ctx.lineWidth=4;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*8,13);ctx.quadraticCurveTo(i*8+8,0,i*8,-10);ctx.stroke();ellipse(i*8-4,-10,7,4,'#a9d27c');ellipse(i*8+4,-13,5,4,'#d3e797')}}else{ctx.fillStyle='#f78254';ctx.beginPath();ctx.moveTo(-8,-13);ctx.bezierCurveTo(19,-18,19,11,-11,21);ctx.bezierCurveTo(0,8,-15,0,-8,-13);ctx.fill();ctx.strokeStyle='#bada8a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-3,-12);ctx.quadraticCurveTo(-7,-21,2,-22);ctx.stroke()}ctx.restore()}
function draw(){const cw=canvas.width,ch=canvas.height;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#153b46';ctx.fillRect(0,0,cw,ch);let scale=Math.min(cw/W,ch/H),ox=(cw-W*scale)/2,oy=(ch-H*scale)/2;ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle='#1a4a53';ctx.fillRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
ctx.strokeStyle='#396c702e';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<18;i++){let x=(i*167+93)%W,y=(i*109+45)%H;ellipse(x,y,2+(i%3),2+(i%3),'#6c929c22')}
ctx.strokeStyle='#85aaa0';ctx.lineWidth=2;ctx.setLineDash([6,9]);ctx.strokeRect(22,46,W-44,H-68);ctx.setLineDash([]);text('SPICY SEA',95,H-48,11,'#7dafa35c');text('90 SECOND EXPEDITION',W-130,H-48,9,'#7dafa35c');
// Central delivery island, pot, and steam.
ellipse(W/2,H/2+12,77,56,'#092f3a55');ellipse(W/2,H/2,73,55,'#dfc68e');ellipse(W/2,H/2,66,48,'#f0dfab');ctx.strokeStyle=inventory.every(Boolean)?'#ffd47a':'#aa996d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W/2,H/2,84,64,0,0,Math.PI*2);ctx.stroke();ellipse(W/2,H/2+12,38,20,'#27434a');ellipse(W/2-39,H/2-2,9,5,'#435e60');ellipse(W/2+39,H/2-2,9,5,'#435e60');ellipse(W/2,H/2-3,40,23,'#4b6565');ellipse(W/2,H/2-5,33,17,'#e16b3c');for(let i=0;i<5;i++)ellipse(W/2-20+i*10,H/2-6+Math.sin(i*3)*6,4,3,i%2?'#e8d9ad':'#88a56c');for(let i=0;i<3;i++){let f=(elapsed*.55+i*.33)%1;ctx.globalAlpha=(1-f)*.55;ellipse(W/2-19+i*19+Math.sin(elapsed+i)*3,H/2-29-f*28,4+f*3,7+f*5,'#fff1c8')}ctx.globalAlpha=1;text(inventory.every(Boolean)?'여기로 배달!':'배달 냄비',W/2,H/2+43,12,'#21444a');
for(let e of entities){if(e.kind==='item'){drawItem(e);continue}ctx.save();ctx.translate(e.x,e.y);if(e.kind==='urchin'){ctx.rotate(e.angle+elapsed*.12);ctx.fillStyle='#93a3b4';for(let i=0;i<10;i++){let a=i*Math.PI/5;ctx.beginPath();ctx.moveTo(Math.cos(a-.16)*12,Math.sin(a-.16)*12);ctx.lineTo(Math.cos(a)*25,Math.sin(a)*25);ctx.lineTo(Math.cos(a+.16)*12,Math.sin(a+.16)*12);ctx.fill()}ellipse(0,0,15,15,'#3c526a');ellipse(-4,-2,2,3,'#ebdbc4');ellipse(4,-2,2,3,'#ebdbc4')}else if(e.kind==='crab'){ctx.strokeStyle='#f1996c';ctx.lineWidth=3;for(let s of [-1,1])for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(s*12,j*6-5);ctx.lineTo(s*(24+j*3),j*9-10+Math.sin(e.angle*5)*2);ctx.stroke()}ellipse(0,0,19,13,'#ec835a');ellipse(-21,-13,7,9,'#f29b72');ellipse(21,-13,7,9,'#f29b72');ellipse(-6,-12,3,4,'#f9e4c7');ellipse(6,-12,3,4,'#f9e4c7');ellipse(-6,-13,1,2,'#133844');ellipse(6,-13,1,2,'#133844')}else{ellipse(0,0,8,8,'#b3e9e37a');ctx.strokeStyle='#d0efe7';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.stroke();ellipse(-2,-3,2,2,'#fff')}ctx.restore()}
for(let e of particles){ctx.globalAlpha=Math.min(1,e.life*2);ellipse(e.x,e.y,3,3,e.color)}ctx.globalAlpha=1;
ctx.save();ctx.translate(p.x,p.y);if(p.inv>0&&Math.sin(elapsed*30)<0)ctx.globalAlpha=.4;ellipse(0,19,19,5,'#082d3980');ctx.rotate(Math.atan2(p.dy,p.dx)+Math.PI/2);ellipse(0,0,17,22,'#f4d48d');ellipse(-18,8,5,11,'#ea9e58');ellipse(18,8,5,11,'#ea9e58');ellipse(-9,21,6,9,'#76bfbf');ellipse(9,21,6,9,'#76bfbf');ellipse(0,-9,16,13,'#e57943');ellipse(0,-12,11,8,'#223e48');ellipse(-3,-14,4,2,'#7eb5b7');ctx.restore();ctx.globalAlpha=1;if(p.cool<=0){ctx.strokeStyle='#f3ca7855';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,28,0,Math.PI*2);ctx.stroke()}for(let f of floats){ctx.globalAlpha=Math.min(1,f.life);text(f.text,f.x,f.y,23,'#ffe296')}ctx.globalAlpha=1;ctx.restore();}
function resize(){let r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2),oldW=W;W=clamp(H*r.width/Math.max(1,r.height),390,1250);if(oldW!==W){p.x=clamp(p.x/oldW*W,25,W-25);for(let e of entities)e.x=e.x/oldW*W;for(let e of particles)e.x=e.x/oldW*W;for(let e of floats)e.x=e.x/oldW*W}canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));draw()}
function frame(now){let dt=Math.min((now-last)/1000||0,.035);last=now;step(dt);draw();requestAnimationFrame(frame)}
$('start').onclick=start;$('overlayStart').onclick=start;$('pause').onclick=pause;$('reset').onclick=()=>{auto=false;reset()};$('auto').onclick=()=>{auto=!auto;updateButtons();if(auto&&phase!=='running')start();else if(phase==='running')notify(auto?'자동 항해 ON':'직접 조작으로 전환했습니다.')};$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dashRequest=true});$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♪ 소리 끄기':'♪ 소리 켜기';$('sound').setAttribute('aria-pressed',String(soundOn));tone(650)};
document.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','p'].includes(k)&&!['BUTTON','A'].includes(document.activeElement.tagName))e.preventDefault();if(k==='p'&&!e.repeat)pause();if(k===' '&&!['BUTTON','A'].includes(document.activeElement.tagName)){dashRequest=true;return}keys[k]=true});document.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});window.addEventListener('blur',()=>{keys={};joy={x:0,y:0};if(phase==='running')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='running')pause()});
let stickId=null;function stickMove(e){if(e.pointerId!==stickId)return;let r=$('stick').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,n=Math.hypot(dx,dy),max=r.width*.32;joy={x:dx/Math.max(max,n),y:dy/Math.max(max,n)};$('knob').style.transform='translate('+joy.x*max+'px,'+joy.y*max+'px)'}$('stick').addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;$('stick').setPointerCapture(stickId);stickMove(e)});$('stick').addEventListener('pointermove',stickMove);for(let event of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(event,()=>{stickId=null;joy={x:0,y:0};$('knob').style.transform='' });new ResizeObserver(resize).observe($('arena'));window.addEventListener('resize',resize);resize();reset();requestAnimationFrame(frame);
</script>
